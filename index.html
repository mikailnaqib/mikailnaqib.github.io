<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an engineering drawing sheet. Title block up top, each project is a numbered sheet with a figure frame and a spec table. */
:root{
  --paper:#f3f5f7;
  --sheet:#fbfcfd;
  --ink:#16202c;
  --ink-2:#4a5664;
  --line:#c9d1da;
  --grid:rgba(22,32,44,.045);
  --accent:#c8331f;          /* remove-before-flight red */
  --accent-ink:#ffffff;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.5rem;--s6:2rem;--s7:3rem;--s8:4.5rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1a2a;--sheet:#13223a;--ink:#e6edf5;--ink-2:#9fb0c4;--line:#2c4160;--grid:rgba(160,190,230,.06);
  --accent:#ef5a43;--accent-ink:#13223a;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1a2a;--sheet:#13223a;--ink:#e6edf5;--ink-2:#9fb0c4;--line:#2c4160;--grid:rgba(160,190,230,.06);
  --accent:#ef5a43;--accent-ink:#13223a;color-scheme:dark}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:1040px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:var(--s6) var(--s8)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.05}
.mono{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.04em}
.label{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- Title block header ---------- */
.titleblock{border:1.5px solid var(--ink);background:var(--sheet);display:grid;grid-template-columns:1fr auto}
.tb-main{padding:var(--s6) var(--s6) var(--s5);border-right:1.5px solid var(--ink);min-width:0}
.tb-main h1{font-size:clamp(2.8rem,8vw,5.2rem);letter-spacing:-.01em;text-transform:uppercase}
.tb-main h1 .first{color:var(--accent)}
.tb-role{font-family:var(--font-display);font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:500;margin-top:var(--s3);color:var(--ink-2)}
.tb-summary{max-width:58ch;margin:var(--s4) 0 0;color:var(--ink)}
.tb-cells{display:grid;grid-template-columns:1fr;min-width:220px}
.tb-cell{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tb-cell:last-child{border-bottom:none}
.tb-cell .v{font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:.4em;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.3em .7em;font-weight:500;align-self:flex-start}

nav.toc{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s4);padding-block:var(--s3);border-bottom:1px solid var(--line)}
nav.toc a{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--ink-2)}
nav.toc a:hover{color:var(--accent)}
nav.toc a span{color:var(--accent);margin-right:.4em}

/* ---------- Sections ---------- */
section{margin-top:var(--s8)}
.sec-head{display:flex;align-items:baseline;gap:var(--s4);border-bottom:1.5px solid var(--ink);padding-bottom:var(--s2);margin-bottom:var(--s5)}
.sec-head h2{font-size:clamp(1.8rem,4vw,2.4rem);text-transform:uppercase;letter-spacing:.01em}
.sec-head .label{margin-left:auto}

/* Experience */
.xp{display:grid;grid-template-columns:150px 1fr;gap:var(--s4) var(--s6);padding-block:var(--s5);border-bottom:1px solid var(--line)}
.xp:first-of-type{padding-top:0}
.xp-when{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:.35rem}
.xp-body{min-width:0}
.xp-body h3{font-size:1.55rem}
.xp-org{font-weight:500;color:var(--ink-2);margin-top:2px}
ul.pts{margin:var(--s3) 0 0;padding:0;list-style:none;display:grid;gap:var(--s2);max-width:68ch}
ul.pts li{position:relative;padding-left:1.25rem}
ul.pts li::before{content:"";position:absolute;left:0;top:.68em;width:.55rem;height:1.5px;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.chip{font-family:var(--font-mono);font-size:.7rem;border:1px solid var(--line);padding:.15em .6em;color:var(--ink-2)}

/* Project sheets */
.sheets{display:grid;gap:var(--s6)}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.fig{border-right:1.5px solid var(--ink);position:relative;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fig img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.fig svg{width:78%;max-width:300px;height:auto}
.fig .fig-cap{position:absolute;left:var(--s3);bottom:var(--s2);background:var(--sheet);padding:0 .35em}
.fig .corner{position:absolute;width:14px;height:14px;border-color:var(--ink-2);border-style:solid}
.fig .c1{top:10px;left:10px;border-width:1px 0 0 1px}.fig .c2{top:10px;right:10px;border-width:1px 1px 0 0}
.fig .c3{bottom:10px;right:10px;border-width:0 1px 1px 0}.fig .c4{bottom:10px;left:10px;border-width:0 0 1px 1px}
.sheet-body{display:flex;flex-direction:column;min-width:0}
.sheet-top{padding:var(--s5);flex:1}
.sheet-top h3{font-size:1.8rem;text-transform:uppercase}
.sheet-top p{margin:var(--s3) 0 0;max-width:62ch}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--ink)}
.specs div{padding:var(--s2) var(--s4);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.specs div:last-child{border-right:none}
.specs .v{font-family:var(--font-mono);font-size:.8rem;overflow-wrap:anywhere}

/* Skills / creds */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s6)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:var(--s2) var(--s4);padding-block:var(--s3);border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv dd{margin:0;min-width:0}
.kv dt{padding-top:.2rem}
.list-plain{list-style:none;padding:0;margin:0;display:grid;gap:var(--s3)}
.list-plain li{display:grid;grid-template-columns:1.6rem 1fr;align-items:baseline}
.list-plain .n{font-family:var(--font-mono);font-size:.72rem;color:var(--accent)}
h3.sub{font-size:1.3rem;text-transform:uppercase;margin-bottom:var(--s3)}

/* Contact */
.contact{background:var(--ink);color:var(--paper);padding:var(--s6);display:grid;grid-template-columns:1fr auto;gap:var(--s5);align-items:end}
.contact h2{font-size:clamp(2rem,5vw,3rem);text-transform:uppercase;color:var(--paper)}
.contact p{margin:var(--s2) 0 0;max-width:46ch;opacity:.85}
.contact .links{display:grid;gap:var(--s2);min-width:0}
.contact .row{display:flex;align-items:center;gap:var(--s3);font-family:var(--font-mono);font-size:.82rem;flex-wrap:wrap}
.contact .row .k{opacity:.6;width:5.5em;text-transform:uppercase;font-size:.68rem;letter-spacing:.12em}
.contact a{color:var(--paper);text-decoration-color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}
.copy{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--paper);border:1px solid currentColor;padding:.2em .6em;cursor:pointer;opacity:.75}
.copy:hover{opacity:1;color:var(--accent)}
footer{margin-top:var(--s5);display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--s3)}

@media (max-width:760px){
  .titleblock{grid-template-columns:1fr}
  .tb-main{border-right:none;border-bottom:1.5px solid var(--ink);padding:var(--s5) var(--s4)}
  .tb-cells{grid-template-columns:1fr 1fr;min-width:0}
  .tb-cell:nth-child(odd){border-right:1px solid var(--line)}
  .xp{grid-template-columns:1fr;gap:var(--s2)}
  .sheet{grid-template-columns:1fr}
  .fig{border-right:none;border-bottom:1.5px solid var(--ink);min-height:200px}
  .specs{grid-template-columns:1fr 1fr}
  .specs div:nth-child(2){border-right:none}
  .specs div:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line);border-right:none}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:var(--s1)}
  .contact{grid-template-columns:1fr;padding:var(--s5) var(--s4)}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{transition:transform .2s ease,box-shadow .2s ease}
  .sheet:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--accent)}
}
</style>
</head>
<body>

<script>

const FIGS = {
  quad:`<svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">

/* ---------------- Render ---------------- */

const pad = n => String(n).padStart(2,"0");

document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
  const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)};
  try{ navigator.clipboard.writeText(b.dataset.v).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r)}); }
  catch(e){}
}));
