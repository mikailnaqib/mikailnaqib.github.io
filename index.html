<script>

  experience: [

      ],
      tags: ["CAD", "Engineering drawings", "Machining"]
    },
    {

      points: [

        "Co-authored a paper on robotic-arm 3D bioprinting for low-cost biofabrication"

/* ---------------- Figure placeholders (line drawings) ---------------- */
const FIGS = {
  quad:`<svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">

    <circle cx="52" cy="52" r="30"/><circle cx="148" cy="52" r="30"/><circle cx="52" cy="148" r="30"/><circle cx="148" cy="148" r="30"/>

    <g stroke-width="1" opacity=".7"><line x1="30" y1="140" x2="170" y2="140"/><line x1="30" y1="135" x2="30" y2="145"/><line x1="170" y1="135" x2="170" y2="145"/></g></svg>`,

/* ---------------- Render ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = PORTFOLIO;
const pad = n => String(n).padStart(2,"0");

const ICONS = {
  light:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>`,
  system:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9"/><path d="M5.5 14.5h5M8 11.5v3"/></svg>`,
  dark:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/></svg>`
};
const header = `
<div class="topbar">
  <div class="theme-switch" role="group" aria-label="Color theme">
    ${["system","light","dark"].map(m=>`<button type="button" data-mode="${m}" aria-pressed="false" aria-label="${m[0].toUpperCase()+m.slice(1)} theme" title="${m[0].toUpperCase()+m.slice(1)}">${ICONS[m]}</button>`).join("")}
  </div>
</div>
<header class="titleblock">
  <div class="tb-main">
    <h1>${esc(P.name.first)} <span class="first">${esc(P.name.preferred)}</span><br>${esc(P.name.last)}</h1>
    <div class="tb-role">${esc(P.role)}</div>
    <p class="tb-summary">${esc(P.summary)}</p>
  </div>
  <div class="tb-cells">
    ${P.meta.map(([k,v])=>`<div class="tb-cell"><span class="label">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}
  </div>
</header>
<nav class="toc" aria-label="Sections">
  <a href="#experience"><span>A</span>Experience</a><a href="#projects"><span>B</span>Projects</a>
  <a href="#skills"><span>C</span>Skills &amp; credentials</a><a href="#contact"><span>D</span>Contact</a>
</nav>`;

const experience = `
<section id="experience">
  <div class="sec-head"><span class="label">A</span><h2>Experience</h2><span class="label">${P.experience.length} roles</span></div>
  ${P.experience.map(x=>`
  <article class="xp">
    <div class="xp-when">${esc(x.when)}</div>
    <div class="xp-body">
      <h3>${esc(x.title)}</h3><div class="xp-org">${esc(x.org)}</div>
      <ul class="pts">${x.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
      ${x.tags?.length?`<div class="chips">${x.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}
    </div>
  </article>`).join("")}
</section>`;

const projects = `
<section id="projects">
  <div class="sec-head"><span class="label">B</span><h2>Projects</h2><span class="label">Sheet 1 of ${P.projects.length}+</span></div>
  <div class="sheets">
  ${P.projects.map((p,i)=>`
    <${p.link?`a href="${esc(p.link)}"`:"article"} class="sheet">
      <div class="fig">
        <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        ${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}">`:(FIGS[p.figure]||FIGS.quad)}
        <span class="label fig-cap">Fig. ${i+1}${p.image?"":" · add photo"}</span>
      </div>
      <div class="sheet-body">
        <div class="sheet-top">
          <div class="label">DWG ${pad(i+1)} · ${esc(p.kind)} · ${esc(p.when)}</div>
          <h3 style="margin-top:var(--s2)">${esc(p.title)}</h3>
          <p>${esc(p.text)}</p>
          ${p.link?`<span class="more">View project &rarr;</span>`:""}
        </div>
        <div class="specs">${p.specs.map(([k,v])=>`<div><span class="label">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>
      </div>
    </${p.link?"a":"article"}>`).join("")}
  </div>
</section>`;

const skills = `
<section id="skills">
  <div class="sec-head"><span class="label">C</span><h2>Skills &amp; credentials</h2></div>
  <div class="grid2">
    <dl style="margin:0">
      ${P.skills.map(([k,v])=>`<div class="kv"><dt class="label">${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}
    </dl>
    <div style="display:grid;gap:var(--s6);align-content:start">
      <div><h3 class="sub">Certifications</h3><ul class="list-plain">${P.certifications.map((c,i)=>`<li><span class="n">${pad(i+1)}</span><span>${esc(c)}</span></li>`).join("")}</ul></div>
      <div><h3 class="sub">Awards</h3><ul class="list-plain">${P.awards.map((c,i)=>`<li><span class="n">${pad(i+1)}</span><span>${esc(c)}</span></li>`).join("")}</ul></div>
    </div>
  </div>
</section>`;

const contact = `
<section id="contact">
  <div class="contact">
    <div><span class="label" style="color:inherit;opacity:.6">D</span><h2>Let's build something that flies.</h2>
      <p>Questions about a project, or want to work together? Reach out.</p></div>
    <div class="links">
      ${P.contact.map(([k,v,href],i)=>`<div class="row"><span class="k">${esc(k)}</span>${href?`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(v)}</a>`:`<span id="c${i}">${esc(v)}</span>`}<button class="copy" type="button" data-v="${esc(v)}">Copy</button></div>`).join("")}
    </div>
  </div>
  <footer><span class="label">Rev. Oct 2026</span><span class="label">${esc(P.name.preferred)} ${esc(P.name.last)}</span></footer>
</section>`;

document.getElementById("app").innerHTML = header + experience + projects + skills + contact;

document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
  const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)};
  try{ navigator.clipboard.writeText(b.dataset.v).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r)}); }
  catch(e){}
}));
</script>
</body>
</html>
